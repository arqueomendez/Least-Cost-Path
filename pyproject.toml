[project]
name = "lcp"
version = "0.1.0"
description = "Least-cost path analysis between multiple points over cost rasters (MCP_Geometric + Numba) for archaeology"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datashader>=0.19.0",
    "fiona>=1.10.1",
    "geopandas>=1.1.1",
    "joblib>=1.5.2",
    "jupyterlab>=4.4.7",
    "matplotlib-scalebar>=0.9.0",
    "numba>=0.61.2",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "psutil>=7.0.0",
    "rasterio>=1.4.3",
    "scikit-image>=0.25.2",
    "scipy>=1.16.1",
    "shapely>=2.1.1",
    "tqdm>=4.67.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = [
    "LCP_MCP_Geometric.py",  # export generado por nbconvert desde el notebook
    "*.ipynb",               # el notebook se valida ejecutandolo, no con lint
    ".ipynb_checkpoints",
    "output",
]

[tool.ruff.lint]
# Reglas fijadas en el repo para que el lint sea reproducible (antes dependia
# de una config externa al repositorio). E4/E7/E9/F son los defaults de ruff;
# W605 (escapes invalidos), I (orden de imports), UP (pyupgrade) y RUF se
# anaden por valor. BLE001 y PLR0402 NO se seleccionan a proposito:
# - BLE001: los workers de lcp/ y las celdas del notebook capturan Exception
#   de forma deliberada para diagnosticar sin tumbar el pool paralelo.
# - PLR0402: el proyecto usa `import lcp.modulo as alias` (AGENTS.md 6.1).
select = ["E4", "E7", "E9", "F", "W605", "I", "UP", "RUF"]

[dependency-groups]
dev = [
    "papermill>=2.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
